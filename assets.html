<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustGrid Africa | Asset Registry</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-body">
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand">
          <div class="brand-mark">TG</div>
          <div>
            <strong>TrustGrid Africa</strong>
            <small>Asset registry</small>
          </div>
        </div>

        <nav class="main-nav" aria-label="Asset navigation">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="assets.html" class="active">Assets</a>
          <a href="reports.html">Reports</a>
        </nav>

        <a class="button button-primary" href="dashboard.html">Review dashboard</a>
      </div>
    </header>

    <main class="page-shell">
      <div class="container page-header">
        <div>
          <p class="eyebrow">Inventory</p>
          <h1>Digital asset register</h1>
        </div>
        <div class="badge-pill">32 assets monitored</div>
      </div>

      <section class="container asset-layout">
        <aside class="panel form-panel">
          <div class="panel-head">
            <h2>Add asset</h2>
          </div>
          <form id="assetForm" class="asset-form">
            <label>
              Asset name
              <input type="text" name="name" placeholder="e.g., Public Website" required />
            </label>
            <label>
              Type
              <select name="type">
                <option>Website</option>
                <option>Web application</option>
                <option>API</option>
                <option>Database</option>
                <option>Server</option>
              </select>
            </label>
            <label>
              Owner
              <input type="text" name="owner" placeholder="Organisation or department" required />
            </label>
            <label>
              Status
              <select name="status">
                <option>Active</option>
                <option>Monitoring</option>
                <option>Needs review</option>
                <option>Archived</option>
              </select>
            </label>
            <button type="submit" class="button button-primary">Save asset</button>
          </form>
        </aside>

        <div class="panel asset-panel">
          <div class="panel-head">
            <h2>Asset overview</h2>
            <div class="segmented" aria-label="Asset filters">
              <button class="chip active" type="button" data-filter="all">All</button>
              <button class="chip" type="button" data-filter="Website">Websites</button>
              <button class="chip" type="button" data-filter="API">APIs</button>
              <button class="chip" type="button" data-filter="Database">Databases</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Asset</th>
                  <th>Type</th>
                  <th>Owner</th>
                  <th>Risk</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="assetList"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div>
          <strong>TrustGrid Africa</strong>
          <small>See every digital asset in context.</small>
        </div>
        <p>© <span id="year"></span> TrustGrid Africa</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
